<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>zigzag — trace</title>
<style>
  :root {
    --bg: #0a0c10; --panel: #12151c; --line: #222732;
    --fg: #d8dde8; --dim: #7c8598;
    --debug: #6b7280; --info: #6ea8fe; --warn: #fbbf24; --error: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  input, select, button {
    background: #0b0e13; color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 9px; font: inherit;
  }
  input:focus, select:focus { outline: none; border-color: var(--info); }
  button { cursor: pointer; }
  button.on { background: var(--info); color: #08111f; border-color: var(--info); }
  #filter { flex: 1; min-width: 160px; }
  .stat { color: var(--dim); font-size: 12px; white-space: nowrap; }
  .stat b { color: var(--fg); font-weight: 600; }
  .stat.drop { color: var(--warn); }
  main { flex: 1; overflow: auto; padding: 4px 0; }
  .row {
    display: grid; grid-template-columns: 92px 52px 84px 1fr;
    gap: 10px; padding: 1px 12px; white-space: pre-wrap; word-break: break-word;
  }
  .row:hover { background: #11141b; }
  .t { color: var(--dim); }
  .l { text-transform: uppercase; font-size: 11px; padding-top: 1px; }
  .l.debug { color: var(--debug); } .l.info { color: var(--info); }
  .l.warn  { color: var(--warn); }  .l.error { color: var(--error); }
  .a { color: #a78bfa; }
  .row.error .m { color: var(--error); }
  .row.warn  .m { color: var(--warn); }
  .empty { color: var(--dim); padding: 30px 12px; }
</style>
</head>
<body>

<header>
  <select id="level">
    <option value="0">all</option>
    <option value="1" selected>info+</option>
    <option value="2">warn+</option>
    <option value="3">error</option>
  </select>
  <select id="area"><option value="">all areas</option></select>
  <input id="filter" placeholder="filter text…">
  <button id="pause">Pause</button>
  <button id="follow" class="on">Follow</button>
  <button id="clear">Clear</button>
  <button id="copy">Copy</button>
  <span class="stat"><b id="shown">0</b> / <b id="total">0</b> lines</span>
  <span class="stat drop" id="dropped" hidden></span>
</header>

<main id="out"><div class="empty">Waiting for trace…</div></main>

</body>
</html>
