version: '3'

tasks:
  package:
    summary: Build a .app bundle — the only shape that can post a notification
    deps: [build]
    cmds:
      - task: bundle
        vars: { PLIST: "build/darwin/Info.plist" }

  package:dev:
    summary: Same bundle, but allowed to reach a homeserver over plain http
    deps: [build]
    cmds:
      - task: bundle
        vars: { PLIST: "build/darwin/Info.dev.plist" }

  bundle:
    internal: true
    summary: Assemble and ad-hoc sign the bundle around an already-built binary
    cmds:
      - rm -rf {{.BIN_DIR}}/{{.APP_NAME}}.app
      - mkdir -p {{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS
      - mkdir -p {{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources
      - cp {{.BIN_DIR}}/{{.APP_NAME}} {{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS/
      - cp {{.PLIST}} {{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Info.plist
      - rm -rf {{.BIN_DIR}}/AppIcon.iconset && mkdir -p {{.BIN_DIR}}/AppIcon.iconset
      - for size in 16 32 128 256 512; do sips -z $size $size build/darwin/appicon.png --out {{.BIN_DIR}}/AppIcon.iconset/icon_${size}x${size}.png >/dev/null; sips -z $((size*2)) $((size*2)) build/darwin/appicon.png --out {{.BIN_DIR}}/AppIcon.iconset/icon_${size}x${size}@2x.png >/dev/null; done
      - iconutil -c icns {{.BIN_DIR}}/AppIcon.iconset -o {{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources/AppIcon.icns
      - rm -rf {{.BIN_DIR}}/AppIcon.iconset
      - codesign --force --deep --sign - {{.BIN_DIR}}/{{.APP_NAME}}.app

  install:
    summary: Package, then install into /Applications so Spotlight and the Dock can find it
    deps: [package:dev]
    cmds:
      - pkill -f "{{.APP_NAME}}.app/Contents/MacOS/{{.APP_NAME}}" || true
      - rm -rf /Applications/{{.APP_NAME}}.app
      - cp -R {{.BIN_DIR}}/{{.APP_NAME}}.app /Applications/
      - /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f /Applications/{{.APP_NAME}}.app
      - 'echo "installed → open /Applications/{{.APP_NAME}}.app"'
